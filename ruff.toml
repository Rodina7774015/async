# ruff.toml
target-version = "py312"
line-length = 88

exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    ".ruff_cache",
    ".vscode",
]

[lint]
select = ["E", "W", "F", "I", "UP", "N", "B", "C4", "SIM", "RET", "ARG"]
ignore = ["E501"]

[lint.isort]
combine-as-imports = true

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"