# ruff.toml

# Максимальная длина строки
line-length = 88
indent-width = 4

# Целевая версия Python
target-version = "py311"

# Папки, которые нужно исключить из проверки
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".mypy_cache",
    ".ruff_cache",
    "build",
    "dist",
]

[lint]
# Группы правил для включения:
# E/W — pycodestyle, F — Pyflakes, I — isort, N — pep8-naming, UP — pyupgrade
select = ["E", "W", "F", "I", "N", "UP"]
ignore = []

# Разрешить автофикс для всех включённых правил
fixable = ["ALL"]
unfixable = []

# Игнорировать неиспользуемые импорты только в __init__.py
[lint.per-file-ignores]
"__init__.py" = ["F401"]

[format]
# Стиль кавычек (double — как у Black)
quote-style = "double"
indent-style = "space"